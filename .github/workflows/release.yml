name: Release

# Releasing a new version – two ways:
#   A. On GitHub: Actions → Release → "Run workflow" (version from package.json).
#   B. From a terminal: bump "version" in package.json, commit, git tag v0.2.0 && git push --tags.
# The workflow builds codriver-vX.Y.Z.exe and attaches it to the Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Version
        id: ver
        run: |
          PKG=v$(bun -e "console.log(require('./package.json').version)")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$PKG" ]; then
            echo "Tag ${GITHUB_REF_NAME} ≠ package.json $PKG"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && gh release view "$PKG" >/dev/null 2>&1; then
            echo "Release $PKG already exists – bump the version in package.json"; exit 1
          fi
          echo "tag=$PKG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bun test
      - name: Build codriver.exe
        run: |
          bun scripts/build.js --target=bun-windows-x64
          mv dist/codriver.exe "dist/codriver-${{ steps.ver.outputs.tag }}.exe"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.ver.outputs.tag }}" "dist/codriver-${{ steps.ver.outputs.tag }}.exe" --target "${GITHUB_SHA}" --title "codriver ${{ steps.ver.outputs.tag }}" --generate-notes
