name: Release

# Wydanie nowej wersji – dwa sposoby:
#   A. Na GitHubie: Actions → Release → „Run workflow” (wersja z package.json).
#   B. Z konsoli: podbij "version" w package.json, commit, git tag v0.2.0 && git push --tags.
# Automat zbuduje codriver.exe i dołączy go do strony Releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Wersja
        id: ver
        run: |
          PKG=v$(bun -e "console.log(require('./package.json').version)")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$PKG" ]; then
            echo "Tag ${GITHUB_REF_NAME} ≠ package.json $PKG"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && gh release view "$PKG" >/dev/null 2>&1; then
            echo "Wydanie $PKG już istnieje – podbij wersję w package.json"; exit 1
          fi
          echo "tag=$PKG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bun test
      - name: Kompilacja codriver.exe
        run: bun scripts/build.js --target=bun-windows-x64
      - name: Wydanie na GitHubie
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.ver.outputs.tag }}" dist/codriver.exe --target "${GITHUB_SHA}" --title "codriver ${{ steps.ver.outputs.tag }}" --generate-notes
